name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # AGENTS.md rule 5. PRs are squashed and the title becomes the commit,
      # so the title is checked too; merge commits are exempt. The title goes
      # through env, never straight into the script.
      - name: Title and commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: bun scripts/conventional-commits.ts --title "$PR_TITLE" --range "$RANGE"

  check:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Reads `packageManager` from package.json, so CI runs the same Bun as
      # the lockfile. Never `latest`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Bun blocks the postinstall of the `gambi` package (npm). That is
      # expected: the CLI works without it.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun x ultracite check

      - name: Board tests use their own database
        run: |
          if git grep -nF ':memory:' -- 'apps/board/src/__tests__/'; then
            echo "::error::Board tests must not use the shared in-memory database. Use createTestDatabase() from apps/board/src/__tests__/test-database.ts."
            exit 1
          fi

      - name: Types
        run: bun run check-types

      - name: Tests
        run: bun run test

      - name: Build board-web
        run: bun run --cwd apps/board-web build

      - name: Build frevo-web
        run: bun run --cwd apps/frevo-web build

  smoke:
    name: Board smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # Boots hub, model fixtures, board and web on free ports, runs the event
      # script (hosted and brought harnesses, tiles, orchestrator), and exits 0/1.
      - name: Smoke
        run: bun run board:smoke

  frevo-smoke:
    name: Frevo smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # Builds the web, boots hub, world and model host (fake model) on free
      # ports, watches a boneco decide by a Room model, kills the model host,
      # restarts the hub, and exits 0/1.
      - name: Smoke
        run: bun run frevo:smoke
